name: Uptime Monitor

on:
  schedule:
    # Every 5 minutes — keeps Render free-tier web service awake (~720 h/month).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          if [ -z "${PING_URL}" ]; then
            echo "Missing PING_URL secret."
            echo "Set PING_URL=https://welding-app-jhhc.onrender.com/api/ping in GitHub repo secrets."
            exit 1
          fi
        env:
          PING_URL: ${{ secrets.PING_URL }}

      - name: Ping Render (keep-alive)
        run: |
          response="$(curl -fsS --max-time 20 "${PING_URL}")"
          echo "Ping response: ${response}"
          RESPONSE="${response}" node -e 'const r=JSON.parse(process.env.RESPONSE||"{}"); if(r.ok!==true){console.error("Keep-alive ping failed", r); process.exit(1)}'
        env:
          PING_URL: ${{ secrets.PING_URL }}
