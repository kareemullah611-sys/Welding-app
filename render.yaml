# Production web service — database is external Neon (fresh), not Render Postgres.
# Set DATABASE_URL (pooled) and DIRECT_URL in the Render dashboard only.
services:
  - type: web
    name: welding-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm audit --omit=dev --audit-level=high && npx prisma generate && tsx scripts/migrate-deploy.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: PRISMA_BOOTSTRAP_MODE
        value: migrate
      - key: PRISMA_MIGRATE_AT_BUILD
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_PRISMA_RLS_CONTEXT
        value: "false"
      - key: CSP_REPORT_URI
        value: /api/csp-report
      - key: NEXT_PUBLIC_APP_URL
        value: https://welding-app-jhhc.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ASSISTANT_ALLOW_EXTERNAL_FINANCIAL_DATA
        value: "false"
