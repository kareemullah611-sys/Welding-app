services:
  - type: web
    name: welding-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run verify
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATABASE_URL
        fromDatabase:
          name: welding-app-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

databases:
  - name: welding-app-db
    plan: free
    region: singapore
    databaseName: welding_app
