<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRF Hardware</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 10%, #2e3f63 0%, #0a1324 50%, #08101d 100%);
        color: #f5f0e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(520px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 20px;
        background: rgba(7, 13, 24, 0.8);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        padding: 28px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 10px; color: #d3d8e4; line-height: 1.5; }
      .meta { font-size: 12px; color: #a8b2c5; margin-top: 10px; word-break: break-all; }
      button {
        margin-top: 16px;
        border: none;
        border-radius: 12px;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 700;
        background: linear-gradient(135deg, #9a3a22 0%, #cc8b60 100%);
        color: white;
        cursor: pointer;
      }
      button:disabled { opacity: 0.7; cursor: wait; }
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">Starting MRF Hardware</h1>
      <p id="message">Loading app...</p>
      <button id="retryBtn" type="button" style="display:none">Retry connection</button>
      <p class="meta" id="targetUrl"></p>
    </main>
    <script>
      (async () => {
        const titleEl = document.getElementById("title");
        const msgEl = document.getElementById("message");
        const retryBtn = document.getElementById("retryBtn");
        const targetUrlEl = document.getElementById("targetUrl");

        if (!window.platformInfo?.retryRemoteLoad) {
          titleEl.textContent = "Cannot connect";
          msgEl.textContent = "This app must run inside the MRF desktop application.";
          return;
        }

        // Try loading via local server first
        try {
          const localPort = await window.platformInfo.getLocalPort();
          if (localPort) {
            const localUrl = "http://127.0.0.1:" + localPort;
            targetUrlEl.textContent = localUrl;
            window.location.replace(localUrl);
            return;
          }
        } catch {}

        const remoteUrl = await window.platformInfo.getRemoteUrl();
        targetUrlEl.textContent = remoteUrl || "";

        // Try remote load
        const tryRemote = async () => {
          retryBtn.style.display = "none";
          msgEl.innerHTML = '<span class="spinner"></span> Connecting to remote...';
          const ok = await window.platformInfo.retryRemoteLoad();
          if (!ok) {
            msgEl.textContent = "Unable to connect. Check your internet connection and try again.";
            retryBtn.style.display = "inline-block";
          }
        };

        retryBtn.addEventListener("click", tryRemote);
        setTimeout(tryRemote, 500);
        window.addEventListener("online", () => tryRemote());
      })();
    </script>
  </body>
</html>
